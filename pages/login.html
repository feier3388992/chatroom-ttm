<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - TTM</title>
<link rel="stylesheet" href="/static/emoji-font.css?v=1">
<link rel="stylesheet" href="/static/style.css?v=46">
<style>
html, body { height: 100%; }
body { display: flex; align-items: center; justify-content: center; }
.login-container {
    width: 400px; height: 480px; box-sizing: border-box; margin: 0; padding: 32px;
    background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
.login-container h1 { text-align: center; margin-bottom: 24px; font-size: 22px; }
.tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
.tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #999; font-size: 15px; }
.tab.active { color: #1677ff; border-bottom: 2px solid #1677ff; margin-bottom: -2px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
.form-group input {
    width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9;
    border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box;
}
.form-group input:focus { border-color: #4096ff; }
.btn-block { width: 100%; padding: 9px; font-size: 15px; }
.msg { text-align: center; font-size: 13px; margin-top: 12px; padding: 8px; border-radius: 6px; display: none; }
.msg.error { display: block; background: #fff2f0; color: #ff4d4f; }
.msg.success { display: block; background: #f6ffed; color: #52c41a; }
</style>
</head>
<body>
<div class="login-container">
    <h1>TTM</h1>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">登录</div>
        <div class="tab" onclick="switchTab('register')">注册</div>
    </div>
    <div id="loginTab" class="tab-content active">
        <div class="form-group"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
        <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
        <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
        <div id="loginMsg" class="msg"></div>
    </div>
    <div id="registerTab" class="tab-content">
        <div class="form-group"><label>用户名</label><input id="regUser" placeholder="请输入用户名"></div>
        <div class="form-group"><label>密码</label><input id="regPass" type="password" placeholder="请输入密码"></div>
        <div class="form-group"><label>邀请码</label><input id="regCode" placeholder="请输入邀请码"></div>
        <button class="btn btn-primary btn-block" onclick="doRegister()">注册</button>
        <div id="regMsg" class="msg"></div>
    </div>
</div>
<script src="/static/resize.js?v=15"></script>
<script>
function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    if (name === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('loginTab').classList.add('active');
    } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('registerTab').classList.add('active');
    }
}
async function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMsg');
    if (!user || !pass) { msg.className = 'msg error'; msg.textContent = '请输入用户名和密码'; return; }
    const res = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:user, password:pass})});
    const data = await res.json();
    if (data.code === 200) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        window.location.href = '/';
    } else {
        msg.className = 'msg error'; msg.textContent = data.msg;
    }
}
async function doRegister() {
    const user = document.getElementById('regUser').value.trim();
    const pass = document.getElementById('regPass').value.trim();
    const code = document.getElementById('regCode').value.trim();
    const msg = document.getElementById('regMsg');
    if (!user || !pass || !code) { msg.className = 'msg error'; msg.textContent = '请填写所有字段'; return; }
    const res = await fetch('/api/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:user, password:pass, invite_code:code})});
    const data = await res.json();
    if (data.code === 200) {
        msg.className = 'msg success'; msg.textContent = '注册成功，请登录';
        document.getElementById('regUser').value = '';
        document.getElementById('regPass').value = '';
        document.getElementById('regCode').value = '';
        setTimeout(() => switchTab('login'), 1000);
    } else {
        msg.className = 'msg error'; msg.textContent = data.msg;
    }
}
if (localStorage.getItem('token')) { location.href = '/'; }
</script>
</body>
</html>
